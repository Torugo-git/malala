<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Minha Conta - MALALA STORE</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { orange: '#FF5500' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <img src="logo-circle.png" alt="MALALA STORE" class="w-10 h-10 rounded-full border border-[#FF5500]/30 shadow-sm">
        <div>
          <span class="text-lg font-black tracking-wider text-gray-900 block leading-none font-serif">MALALA</span>
          <span class="text-[10px] text-[#FF5500] font-bold tracking-widest uppercase">STORE</span>
        </div>
      </a>

      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-bold text-gray-600 hover:text-[#FF5500] transition-colors hidden sm:inline">
          <i class="fa-solid fa-store"></i> Voltar à Loja
        </a>
        <button onclick="logout()" class="bg-gray-100 border border-gray-200 hover:bg-red-50 hover:border-red-200 hover:text-red-600 text-gray-700 px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full flex-1">
    
    <!-- PERFIL DO UTILIZADOR -->
    <div class="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm mb-8 flex items-center gap-4">
      <div class="w-16 h-16 bg-[#FF5500]/10 text-[#FF5500] rounded-full flex items-center justify-center text-2xl shadow-inner border border-[#FF5500]/20">
        <i class="fa-solid fa-user-check"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black text-gray-900" id="userNameDisplay">Carregando...</h1>
        <p class="text-xs text-gray-500 font-medium mt-1" id="userEmailDisplay">Por favor, aguarde.</p>
      </div>
    </div>

    <h2 class="text-lg font-extrabold text-gray-900 mb-4 flex items-center gap-2">
      <i class="fa-solid fa-box-open text-[#FF5500]"></i> Histórico de Pedidos
    </h2>

    <!-- LISTA DE PEDIDOS -->
    <div id="ordersContainer" class="space-y-4">
      <div class="text-center py-10 text-gray-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-[#FF5500]"></i>
        <p class="text-xs font-bold">A carregar os seus pedidos...</p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400">
    &copy; 2026 MALALA STORE. Ambiente seguro.
  </footer>

  <script>
    const defaultFirebaseConfig = {
      apiKey: "AIzaSyBCkwx1KJS_ZvPM0McJOF7_KbPzwahvZgY",
      authDomain: "malala-ca5f9.firebaseapp.com",
      projectId: "malala-ca5f9",
      storageBucket: "malala-ca5f9.firebasestorage.app",
      messagingSenderId: "769152463954",
      appId: "1:769152463954:web:1ee46b91c8e8b4c4d75b8b",
      measurementId: "G-XSB0EFBQ6E"
    };

    let db = null;
    let auth = null;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      let config = defaultFirebaseConfig;
      const savedCfg = localStorage.getItem('malala_firebase_config');
      if (savedCfg) { try { config = JSON.parse(savedCfg); } catch(e){} }
      
      if (!firebase.apps.length) firebase.initializeApp(config);
      db = firebase.firestore();
      auth = firebase.auth();

      // Verifica se o utilizador está logado. Se não estiver, expulsa para a página principal.
      auth.onAuthStateChanged((user) => {
        if (user && user.emailVerified) {
          currentUser = user;
          document.getElementById('userNameDisplay').innerText = `Olá, ${user.displayName || 'Cliente'}`;
          document.getElementById('userEmailDisplay').innerText = user.email;
          fetchUserOrders(user.email);
        } else {
          window.location.href = 'index.html';
        }
      });
    });

    function fetchUserOrders(email) {
      if (!db) return;
      
      db.collection('orders')
        .where('payer.email', '==', email)
        .onSnapshot(snap => {
          let orders = [];
          snap.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
          
          // Ordena do mais recente para o mais antigo localmente
          orders.sort((a,b) => {
            const dateA = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)) : new Date(0);
            const dateB = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)) : new Date(0);
            return dateB - dateA;
          });

          renderOrders(orders);
        }, err => {
          console.error("Erro ao carregar pedidos: ", err);
          document.getElementById('ordersContainer').innerHTML = `<p class="text-red-500 text-xs font-bold p-4 bg-red-50 rounded-xl">Ocorreu um erro ao carregar o histórico.</p>`;
        });
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      
      if (orders.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-10 rounded-3xl border border-gray-200 text-center shadow-sm">
            <i class="fa-solid fa-bag-shopping text-4xl text-gray-200 mb-4"></i>
            <h3 class="text-sm font-black text-gray-900">Ainda não fez nenhuma encomenda</h3>
            <p class="text-xs text-gray-500 mt-1 mb-5">Quando efetuar compras, elas aparecerão aqui com todos os detalhes de envio.</p>
            <a href="index.html" class="inline-block bg-[#FF5500] hover:bg-[#E64A00] text-white text-xs font-bold px-6 py-3 rounded-xl shadow-md transition-all">Ir às compras</a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(ord => {
        const dateObj = ord.createdAt ? (ord.createdAt.toDate ? ord.createdAt.toDate() : new Date(ord.createdAt)) : new Date();
        const formattedDate = dateObj.toLocaleDateString('pt-BR') + ' às ' + dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        
        const statusClass = ord.status === 'Pago' 
          ? 'bg-emerald-100 text-emerald-800 border-emerald-200' 
          : 'bg-amber-100 text-amber-800 border-amber-200';

        const itemsList = (ord.items || []).map(i => `
          <div class="flex items-center justify-between text-xs py-2 border-b border-gray-100 last:border-0">
            <span class="font-bold text-gray-800"><span class="text-gray-400 font-normal">${i.quantity || 1}x</span> ${i.title}</span>
            <span class="text-gray-600 font-mono">R$ ${((i.price || 0) * (i.quantity || 1)).toFixed(2).replace('.', ',')}</span>
          </div>
        `).join('');

        return `
          <div class="bg-white p-5 sm:p-6 rounded-3xl border border-gray-200 shadow-sm hover:border-[#FF5500]/30 transition-colors">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-gray-100">
              <div>
                <span class="font-mono text-xs font-black bg-gray-100 px-3 py-1 rounded-lg text-gray-700">#${ord.id}</span>
                <span class="text-[10px] text-gray-400 ml-2"><i class="fa-regular fa-clock"></i> ${formattedDate}</span>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-[10px] uppercase font-black px-3 py-1 rounded-full border ${statusClass}">${ord.status || 'Pendente'}</span>
                <span class="text-sm font-black text-gray-900">R$ ${(ord.total || ord.totalAmount || 0).toFixed(2).replace('.', ',')}</span>
              </div>
            </div>
            <div class="pt-4">
              <p class="text-[10px] uppercase font-bold text-gray-400 mb-2">Resumo dos Itens</p>
              <div class="bg-gray-50 rounded-xl px-4 py-1 border border-gray-100">
                ${itemsList}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function logout() {
      if (auth) {
        auth.signOut().then(() => {
          window.location.href = 'index.html';
        });
      }
    }
  </script>
</body>
</html>
